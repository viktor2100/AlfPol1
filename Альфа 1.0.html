  ]);
  await sleep(400);
  const verdict=document.getElementById('rvVerdict');
  if(verdict){
    verdict.textContent = res.passed? (res.kind==='law' ? 'ПАРЛАМЕНТ ОДОБРИЛ' : 'ПРИНЯТО') : 'ОТКЛОНЕНО';
    verdict.classList.add('show', res.passed?'pass':'fail');
  }
  const btn = document.getElementById('revealContinueBtn');
  if(btn) btn.style.display='';
  await waitForClick('revealContinueBtn');
  animatingReveal=false;
  startPolling();
}

async function createRoom(name, systemTypeKey, botCount, botDifficulty){
  const code = Math.random().toString(36).slice(2,6).toUpperCase();
  me.name=name; me.roomCode=code;
  const sysDef = SYSTEM_TYPES[systemTypeKey];
  const players = [{id:me.id, name, party:null}];
  for(let i=0;i<botCount;i++){
    players.push({ id:'bot_'+uid(), name:`Бот ${i+1}`, party:null, isBot:true, difficulty:botDifficulty });
  }
  const state = {
    code, systemTypeKey, status:'lobby', hostId: me.id,
    players,
    cycle:0, phase:1, turnOrder:[], turnIndex:0, firstMoveIndex:0,
    budgets:{}, hands:{}, support:{}, passed:[], cardHistory:{}, frozenCardIds:{},
    electoralThreshold: sysDef.threshold, budgetPerCycle: START_BUDGET,
    electoralFormula: sysDef.formula, pendingSystemChange:null,
    turnout:50, availableReforms:[], availableLaws:[], governmentDismissedThisCycle:false,
    electionResult:null, allPassedLaws:[], proposedThisCycle:[], cycleActions:[],
    reformBonus:{}, pendingAction:null, pendingPresidentialApproval:null,
    phase3Queue:[], phase3QueueIndex:0, lastResolution:null, passedHistory:[],
    currentEvent:null, currentEventDesc:null, lastPresident:null, winners:null,
    log:[`Комната ${code} создана (${sysDef.label})`],
  };
  try{
    await netHostRoom(code,state);
    await saveRoom(state);
    room=state; view='lobby'; startPolling(); startBotTicker(); render();
  }catch(e){
    uiError='Не удалось создать сетевую комнату. Проверьте интернет-соединение и попробуйте ещё раз.';
    render();
  }
}

async function joinRoom(name, code){
  code = code.trim().toUpperCase();
  try{ await netJoinRoom(code); }
  catch(e){ uiError='Не удалось подключиться к комнате. Проверьте код и интернет-соединение.'; render(); return; }
  const r = await loadRoom(code);
  if(!r){ uiError='Комната не найдена. Проверьте код.'; render(); return; }
  if(r.status!=='lobby'){ uiError='Игра в этой комнате уже началась.'; render(); return; }
  if(!r.players.some(p=>p.id===me.id)){
    r.players.push({id:me.id, name, party:null});
    r.log.push(`${name} присоединился(-лась) к комнате`);
  }
  me.name=name; me.roomCode=code;
  await saveRoom(r);
  room=r; view='lobby'; uiError=''; startPolling(); startBotTicker(); render();
}

async function choosePartyAction(partyKey){
  const r = await loadRoom(room.code);
  if(!r) return;
  const taken = r.players.find(p=>p.party===partyKey && p.id!==me.id);
  if(taken) return;
  const p = r.players.find(p=>p.id===me.id);
  if(p) p.party = partyKey;
  await saveRoom(r); room=r; render();
}

function rotatedTurnOrder(r){
  const n = r.players.length;
  const offset = n ? (r.firstMoveIndex||0) % n : 0;
  const ids = r.players.map(p=>p.id);
  return ids.slice(offset).concat(ids.slice(0,offset));
}

async function startGameAction(){
  const r = await loadRoom(room.code);
  if(!r) return;
  const unclaimed = PARTY_KEYS.filter(k=>!r.players.some(p=>p.party===k));
  r.players.forEach(p=>{
    if(p.isBot && !p.party && unclaimed.length){
      const idx = Math.floor(Math.random()*unclaimed.length);
      p.party = unclaimed.splice(idx,1)[0];
    }
  });
  r.status='playing';
  r.cycle=1; r.phase=1;
  r.firstMoveIndex = 0;
  r.turnOrder = rotatedTurnOrder(r);
  r.turnIndex = 0;
  r.support = {}; r.passed=[];
  drawAndApplyEvent(r);
  updateTurnout(r);
  rollReforms(r);
  r.players.forEach(p=>{ r.budgets[p.id]=r.budgetPerCycle; r.hands[p.id]=dealHand(); r.support[p.party]=0; r.frozenCardIds[p.id]=[]; });
  r.log.push(`— Цикл 1 начался. На повестке: ${r.currentEvent}. Фаза 1: агитация. —`);
  await saveRoom(r); room=r; view='game'; render();
}

async function playCardAction(handId, targetParty){
  const r = await loadRoom(room.code);
  if(!r) return;
  if(r.turnOrder[r.turnIndex]!==me.id) return;
  if(r.passed.includes(me.id)) return;
  const p = r.players.find(p=>p.id===me.id);
  const hand = r.hands[me.id]||[];
  const card = hand.find(c=>c.handId===handId);
  if(!card || r.budgets[me.id] < card.cost) return;
  if(card.type==='discredit'){
    if(!targetParty) return;
    const targetOk = r.players.some(pl=>pl.party===targetParty && pl.id!==me.id) && cardMeetsPrereq(card, targetParty, r);
    if(!targetOk) return;
  }
  botApplyCard(r, p, card, targetParty);
  r.frozenCardIds[me.id] = (r.frozenCardIds[me.id]||[]).filter(id=>id!==handId);
  if(card.type==='agitation'){
    flashBadge(card.moneyCard?('+₽'+card.value):('+'+((card.bonus||[]).includes(p.party)?card.value+1:card.value)), card.moneyCard?'#e8c96b':PARTIES[p.party].color);
  } else {
    flashBadge('−'+card.value, '#e07a72');
  }
  await saveRoom(r); room=r; render();
}

function handleCardClick(handId){
  const hand = room.hands[me.id]||[];
  const card = hand.find(c=>c.handId===handId);
  if(!card) return;
  const cardEl = document.querySelector(`[data-play="${handId}"]`);
  if(cardEl) cardEl.classList.add('card-playing');
  if(card.type==='agitation'){
    setTimeout(()=>{ playCardAction(handId, null); }, 380);
  } else {
    setTimeout(()=>{ discreditPicker={handId, card}; render(); }, 380);
  }
}
function chooseDiscreditTarget(targetParty){
  if(!discreditPicker) return;
  const handId = discreditPicker.handId;
  discreditPicker=null;
  playCardAction(handId, targetParty);
}
function flashBadge(text, color){
  const el=document.createElement('div');
  el.className='flash-badge';
  el.textContent=text;
  el.style.color=color;
  document.body.appendChild(el);
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{ el.classList.add('rise'); }); });
  setTimeout(()=>{ el.remove(); }, 1100);
}

async function toggleFreezeAction(handId){
  const r = await loadRoom(room.code);
  if(!r) return;
  r.frozenCardIds[me.id] = r.frozenCardIds[me.id]||[];
  const idx = r.frozenCardIds[me.id].indexOf(handId);
  if(idx>=0){ r.frozenCardIds[me.id].splice(idx,1); }
  else {
    if(r.frozenCardIds[me.id].length>=3) return;
    if(!(r.hands[me.id]||[]).some(c=>c.handId===handId)) return;
    r.frozenCardIds[me.id].push(handId);
  }
  await saveRoom(r); room=r; render();
}

async function passAction(){
  const r = await loadRoom(room.code);
  if(!r) return;
  if(r.turnOrder[r.turnIndex]!==me.id) return;
  if(!r.passed.includes(me.id)) r.passed.push(me.id);
  const p=r.players.find(p=>p.id===me.id);
  r.log.push(`${p.name} закончил(а) ход в фазе агитации`);
  advanceTurn(r);
  await saveRoom(r); await applyRoomUpdate(r);
}

async function handOffTurnAction(){
  const r = await loadRoom(room.code);
  if(!r) return;
  if(r.turnOrder[r.turnIndex]!==me.id) return;
  if(r.passed.includes(me.id)) return;
  const p=r.players.find(p=>p.id===me.id);
  r.log.push(`${p.name} передал(а) ход`);
  advanceTurn(r);
  await saveRoom(r); await applyRoomUpdate(r);
}

function advanceTurn(r){
  const active = r.players.filter(p=>!r.passed.includes(p.id));
  if(active.length===0){ runElection(r); return; }
  let next = (r.turnIndex+1) % r.turnOrder.length;
  let guard=0;
  while(r.passed.includes(r.turnOrder[next]) && guard<r.turnOrder.length+1){
    next = (next+1)%r.turnOrder.length; guard++;
  }
  r.turnIndex=next;
}

function runElection(r){
  const turnoutFactor = (r.turnout||50)/50;
  const shares = {};
  PARTY_KEYS.forEach(k=>{
    if(r.players.some(p=>p.party===k)){
      const base = (r.support[k]||0)+(r.reformBonus[k]||0);
      const swing = 0.6 + Math.random()*0.8;
      const chaos = Math.random()*12*turnoutFactor;
      shares[k] = Math.max(0.5, base*swing + chaos);
    }
  });
  const votingPop = Math.round(TOTAL_POPULATION*(r.turnout||50)/100);
  const totalShare = Object.values(shares).reduce((a,b)=>a+b,0)||1;
  const votes = {};
  Object.keys(shares).forEach(k=>{ votes[k]=Math.round(votingPop*shares[k]/totalShare); });
  const seats = allocateSeats(votes, TOTAL_SEATS, r.electoralFormula, r.electoralThreshold);
  r.electionResult = {votes, seats, president:null, presidentVotes:null, government:null, invited:[], govSeats:{}, ts:Date.now(), presTs:null};
  const sysDef = getSysDef(r);
  if(!sysDef.hasPresident){
    const leader = getLeaderParty(r);
    if(leader){ r.electionResult.invited=[leader]; r.electionResult.govSeats={[leader]:GOV_SEATS_TOTAL}; r.lastPresident=leader; }
    r.reformBonus = {};
  }
  r.phase=2;
  r.log.push(`— Парламентские выборы завершены (явка ${r.turnout}%, ${fmtNum(votingPop)} чел.) —`);
}

function runPresidentialElection(r){
  const turnoutFactor = (r.turnout||50)/50;
  const shares = {};
  PARTY_KEYS.forEach(k=>{
    if(r.players.some(p=>p.party===k)){
      const base = (r.support[k]||0)+(r.reformBonus[k]||0);
      const swing = 0.4 + Math.random()*1.2;
      const chaos = Math.random()*25*turnoutFactor;
      shares[k] = Math.max(0.5, base*swing + chaos);
    }
  });
  const votingPop = Math.round(TOTAL_POPULATION*(r.turnout||50)/100);
  const totalShare = Object.values(shares).reduce((a,b)=>a+b,0)||1;
  const pvotes = {};
  Object.keys(shares).forEach(k=>{ pvotes[k]=Math.round(votingPop*shares[k]/totalShare); });
  const presidentParty = Object.entries(pvotes).sort((a,b)=>b[1]-a[1])[0]?.[0] || null;
  r.electionResult.presidentVotes = pvotes;
  r.electionResult.president = presidentParty;
  r.electionResult.invited = presidentParty ? [presidentParty] : [];
  r.electionResult.govSeats = presidentParty ? {[presidentParty]:GOV_SEATS_TOTAL} : {};
  r.electionResult.presTs = Date.now();
  r.lastPresident = presidentParty;
  r.reformBonus = {};
  r.log.push(`— Президентские выборы завершены. Президент: ${presidentParty?PARTIES[presidentParty].name:'—'} —`);
}

let presElectionInFlight = false;
async function runPresidentialElectionAction(){
  if(presElectionInFlight) return;
  presElectionInFlight = true;
  try{
    const r = await loadRoom(room.code);
    if(!r || !r.electionResult || r.electionResult.president) return;
    runPresidentialElection(r);
    await saveRoom(r); await applyRoomUpdate(r);
  } finally {
    presElectionInFlight = false;
  }
}

async function toggleInviteAction(partyKey){
  const r = await loadRoom(room.code);
  if(!r || !r.electionResult || r.electionResult.government) return;
  const leaderParty = getLeaderParty(r);
  const meParty = (r.players.find(p=>p.id===me.id)||{}).party;
  if(leaderParty !== meParty) return;
  const er = r.electionResult;
  er.invited = er.invited && er.invited.length ? er.invited : [leaderParty];
  er.govSeats = er.govSeats||{};
  if(!er.invited.includes(partyKey)){ er.invited.push(partyKey); er.govSeats[partyKey]=0; }
  await saveRoom(r); room=r; render();
}
async function removeInviteAction(partyKey){
  const r = await loadRoom(room.code);
  if(!r || !r.electionResult || r.electionResult.government) return;
  const leaderParty = getLeaderParty(r);
  const meParty = (r.players.find(p=>p.id===me.id)||{}).party;
  if(leaderParty !== meParty || partyKey===leaderParty) return;
  const er = r.electionResult;
  er.invited = (er.invited||[]).filter(k=>k!==partyKey);
  delete er.govSeats[partyKey];
  await saveRoom(r); room=r; render();
}
async function adjustGovSeatsAction(partyKey, delta){
  const r = await loadRoom(room.code);
  if(!r || !r.electionResult || r.electionResult.government) return;
  const leaderParty = getLeaderParty(r);
  const meParty = (r.players.find(p=>p.id===me.id)||{}).party;
  if(leaderParty !== meParty) return;
  const er = r.electionResult;
  er.govSeats = er.govSeats||{};
  if(!(er.invited||[]).includes(partyKey)) return;
  const current = er.govSeats[partyKey]||0;
  const others = Object.entries(er.govSeats).filter(([k])=>k!==partyKey).reduce((s,[,v])=>s+v,0);
  er.govSeats[partyKey] = Math.max(0, Math.min(GOV_SEATS_TOTAL-others, current+delta));
  await saveRoom(r); room=r; render();
}
async function confirmGovernmentAction(){
  const r = await loadRoom(room.code);
  if(!r || !r.electionResult || r.electionResult.government) return;
  const leaderParty = getLeaderParty(r);
  const meParty = (r.players.find(p=>p.id===me.id)||{}).party;
  if(leaderParty !== meParty) return;
  const er = r.electionResult;
  const total = Object.values(er.govSeats||{}).reduce((a,b)=>a+b,0);
  if(total!==GOV_SEATS_TOTAL) return;
  er.government = Object.keys(er.govSeats).filter(k=>er.govSeats[k]>0);
  r.log.push(`— Правительство сформировано: ${er.government.map(k=>`${PARTIES[k].name} ${er.govSeats[k]}`).join(', ')} —`);
  await saveRoom(r); room=r; render();
}
async function dismissGovernmentAction(){
  const r = await loadRoom(room.code);
  if(!r || !r.electionResult || !r.electionResult.government) return;
  const sysDef = getSysDef(r);
  if(!sysDef.canLeaderDismissUnilaterally) return;
  const leaderParty = getLeaderParty(r);
  const meParty = (r.players.find(p=>p.id===me.id)||{}).party;
  if(leaderParty !== meParty) return;
  reverseReformEffects(r);
  r.electionResult.government=null; r.electionResult.govSeats={}; r.electionResult.invited=[];
  r.governmentDismissedThisCycle = true;
  r.log.push(`— ${sysDef.hasPresident?'Президент':'Премьер-министр'} распустил(а) правительство —`);
  await saveRoom(r); room=r; render();
}

async function toPhase3Action(){
  const r = await loadRoom(room.code);
  if(!r || !r.electionResult || !r.electionResult.government) return;
  r.phase=3;
  r.proposedThisCycle=[]; r.cycleActions=[]; r.pendingAction=null; r.pendingPresidentialApproval=null;
  rollLawsForCycle(r);
  const parliamentParties = PARTY_KEYS.filter(k=>(r.electionResult.seats[k]||0)>0);
  const govParties = r.electionResult.government;
  const orderedParliament = r.players.filter(p=>parliamentParties.includes(p.party)).map(p=>p.party);
  const orderedGov = r.players.filter(p=>govParties.includes(p.party)).map(p=>p.party);
  const queue=[];
  const maxLen = Math.max(orderedParliament.length, orderedGov.length);
  for(let i=0;i<maxLen;i++){
    if(orderedParliament[i]) queue.push({kind:'law', party:orderedParliament[i]});
    if(orderedGov[i]) queue.push({kind:'reform', party:orderedGov[i]});
  }
  r.phase3Queue = queue;
  r.phase3QueueIndex = 0;
  r.log.push(`— Фаза 3: законы чередуются с реформами правительства —`);
  await saveRoom(r); room=r; render();
}

async function proposeItemAction(kind, title){
  const r = await loadRoom(room.code);
  if(!r || r.pendingAction) return;
  const item = r.phase3Queue[r.phase3QueueIndex];
  if(!item || item.kind!==kind) return;
  const meParty = (r.players.find(p=>p.id===me.id)||{}).party;
  if(item.party !== meParty) return;
  r.pendingAction = { kind, title, by:item.party, votes:{} };
  const p = r.players.find(p=>p.id===me.id);
  r.log.push(`${p.name} (${PARTIES[item.party].name}) выносит на голосование ${kind==='law'?'закон':'реформу'} «${title}»`);
  selectedProposalTitle = null;
  await saveRoom(r); room=r; render();
}

async function skipQueueItemAction(){
  const r = await loadRoom(room.code);
  if(!r || r.pendingAction) return;
  const item = r.phase3Queue[r.phase3QueueIndex];
  if(!item) return;
  const meParty = (r.players.find(p=>p.id===me.id)||{}).party;
  if(item.party !== meParty) return;
  const p = r.players.find(p=>p.id===me.id);
  r.log.push(`${p.name} (${PARTIES[item.party].name}) передал(а) ход без внесения`);
  r.phase3QueueIndex += 1;
  selectedProposalTitle = null;
  await saveRoom(r); room=r; render();
}

async function castVoteAction(choice){
  const r = await loadRoom(room.code);
  if(!r || !r.pendingAction) return;
  const p = r.players.find(p=>p.id===me.id);
  if(!p) return;
  const weightMap = r.pendingAction.kind==='reform' ? (r.electionResult.govSeats||{}) : r.electionResult.seats;
  if(!(weightMap[p.party]>0)) return;
  if(r.pendingAction.votes[p.id]!==undefined) return;
  r.pendingAction.votes[p.id]=choice;
  resolvePendingIfComplete(r);
  await saveRoom(r); await applyRoomUpdate(r);
}

async function presidentialDecisionAction(approve){
  const r = await loadRoom(room.code);
  if(!r || !r.pendingPresidentialApproval) return;
  const leaderParty = getLeaderParty(r);
  const meParty = (r.players.find(p=>p.id===me.id)||{}).party;
  if(leaderParty !== meParty) return;
  applyPresidentialDecision(r, approve);
  await saveRoom(r); room=r; render();
}

async function endCycleAction(){
  const r = await loadRoom(room.code);
  if(!r) return;
  r.cycle+=1;
  if(r.pendingSystemChange){
    r.systemTypeKey = r.pendingSystemChange;
    r.pendingSystemChange = null;
    r.log.push(`— С цикла ${r.cycle} политическая система: ${SYSTEM_TYPES[r.systemTypeKey].label} —`);
  }
  drawAndApplyEvent(r);
  updateTurnout(r);
  rollReforms(r);
  r.phase=1; r.passed=[];
  r.firstMoveIndex = (r.firstMoveIndex||0) + 1;
  r.turnOrder=rotatedTurnOrder(r); r.turnIndex=0;
  r.support={};
  r.players.forEach(p=>{
    const oldHand = r.hands[p.id]||[];
    const frozenIds = r.frozenCardIds[p.id]||[];
    const kept = oldHand.filter(c=>frozenIds.includes(c.handId)).slice(0,3);
    const fresh = dealHandN(HAND_SIZE-kept.length);
    r.hands[p.id] = [...kept, ...fresh];
    r.frozenCardIds[p.id] = [];
    r.budgets[p.id]=(r.budgets[p.id]||0)+r.budgetPerCycle;
    r.support[p.party]=0;
  });
  r.electionResult=null;
  r.pendingAction=null; r.pendingPresidentialApproval=null;
  r.phase3Queue=[]; r.phase3QueueIndex=0; r.proposedThisCycle=[]; r.cycleActions=[];
  r.log.push(`— Цикл ${r.cycle} начался. На повестке: ${r.currentEvent}. Фаза 1: агитация. —`);
  await saveRoom(r); room=r; render();
}

async function returnToLobbyAction(){
  const r = await loadRoom(room.code);
  if(!r) return;
  r.status='lobby';
  r.winners=null;
  r.electionResult=null;
  r.cycle=0; r.phase=1;
  r.allPassedLaws=[]; r.passedHistory=[]; r.cycleActions=[]; r.proposedThisCycle=[];
  r.reformBonus={}; r.pendingAction=null; r.pendingPresidentialApproval=null; r.pendingSystemChange=null;
  r.availableReforms=[]; r.availableLaws=[]; r.cardHistory={}; r.frozenCardIds={};
  r.currentEvent=null; r.currentEventDesc=null; r.lastPresident=null; r.governmentDismissedThisCycle=false;
  r.players.forEach(p=>{ p.party=null; });
  r.log.push(`— Возврат в лобби для новой партии —`);
  await saveRoom(r); room=r; view='lobby'; render();
}

/* ============================== EVENTS ============================== */

function bindAsync(el, fn){
  if(!el) return;
  el.onclick = async (e)=>{
    if(el.disabled) return;
    el.disabled = true;
    try{ await fn(e); }
    finally{ el.disabled = false; }
  };
}

function attachHandlers(){
  const createBtn=document.getElementById('createBtn');
  bindAsync(createBtn, async ()=>{
    const name=document.getElementById('hostName').value.trim();
    const systemTypeKey=document.getElementById('scenarioSel').value;
    const botCount=parseInt(document.getElementById('botCountSel').value,10)||0;
    const botDifficulty=document.getElementById('botDifficultySel').value;
    if(!name){ uiError='Введите имя'; render(); return; }
    uiError=''; await createRoom(name, systemTypeKey, botCount, botDifficulty);
  });
  const joinBtn=document.getElementById('joinBtn');
  bindAsync(joinBtn, async ()=>{
    const name=document.getElementById('joinName').value.trim();
    const code=document.getElementById('joinCode').value.trim();
    if(!name||!code){ uiError='Введите имя и код комнаты'; render(); return; }
    uiError=''; await joinRoom(name, code);
  });
  document.querySelectorAll('.standard').forEach(el=>{
    bindAsync(el, async ()=>{ if(!el.classList.contains('taken')) await choosePartyAction(el.dataset.party); });
  });
  const startBtn=document.getElementById('startBtn');
  bindAsync(startBtn, startGameAction);

  const notesEl=document.getElementById('myNotes');
  if(notesEl){ notesEl.value=myNotes; notesEl.oninput=(e)=>{ myNotes=e.target.value; }; }

  document.querySelectorAll('.playcard').forEach(el=>{
    el.onclick=()=>{ if(!el.classList.contains('disabled')) handleCardClick(el.dataset.play); };
  });
  document.querySelectorAll('.freeze-toggle').forEach(el=>{
    bindAsync(el, async (e)=>{ e.stopPropagation(); await toggleFreezeAction(el.dataset.freeze); });
  });
  const passBtn=document.getElementById('passBtn');
  bindAsync(passBtn, passAction);
  const handOffBtn=document.getElementById('handOffBtn');
  bindAsync(handOffBtn, handOffTurnAction);

  document.querySelectorAll('[data-target]').forEach(el=>{
    bindAsync(el, ()=>chooseDiscreditTarget(el.dataset.target));
  });
  const cancelDiscreditBtn=document.getElementById('cancelDiscreditBtn');
  if(cancelDiscreditBtn) cancelDiscreditBtn.onclick=()=>{ discreditPicker=null; render(); };

  const runPresBtn=document.getElementById('runPresBtn');
  bindAsync(runPresBtn, runPresidentialElectionAction);

  document.querySelectorAll('.gov-chip[data-invite]').forEach(el=>{
    bindAsync(el, ()=>toggleInviteAction(el.dataset.invite));
  });
  document.querySelectorAll('[data-govinc]').forEach(el=>{
    bindAsync(el, ()=>adjustGovSeatsAction(el.dataset.govinc, 1));
  });
  document.querySelectorAll('[data-govdec]').forEach(el=>{
    bindAsync(el, ()=>adjustGovSeatsAction(el.dataset.govdec, -1));
  });
  document.querySelectorAll('[data-uninvite]').forEach(el=>{
    bindAsync(el, ()=>removeInviteAction(el.dataset.uninvite));
  });
  const confirmGovBtn=document.getElementById('confirmGovBtn');
  bindAsync(confirmGovBtn, confirmGovernmentAction);
  const dismissGovBtn=document.getElementById('dismissGovBtn');
  bindAsync(dismissGovBtn, dismissGovernmentAction);

  const toPhase3Btn=document.getElementById('toPhase3Btn');
  bindAsync(toPhase3Btn, toPhase3Action);

  document.querySelectorAll('.proposal-row').forEach(el=>{
    el.onclick=()=>{ selectedProposalTitle=el.dataset.choose; render(); };
  });
  const proposeItemBtn=document.getElementById('proposeItemBtn');
  bindAsync(proposeItemBtn, async ()=>{
    if(!selectedProposalTitle) return;
    const item = room.phase3Queue[room.phase3QueueIndex];
    if(item) await proposeItemAction(item.kind, selectedProposalTitle);
  });
  const skipQueueBtn=document.getElementById('skipQueueBtn');
  bindAsync(skipQueueBtn, skipQueueItemAction);

  document.querySelectorAll('.vote-buttons button[data-vote]').forEach(el=>{
    bindAsync(el, ()=>castVoteAction(el.dataset.vote));
  });

  const signBtn=document.getElementById('signBtn');
  bindAsync(signBtn, ()=>presidentialDecisionAction(true));
  const vetoBtn=document.getElementById('vetoBtn');
  bindAsync(vetoBtn, ()=>presidentialDecisionAction(false));

  const endCycleBtn=document.getElementById('endCycleBtn');
  bindAsync(endCycleBtn, endCycleAction);

  const returnLobbyBtn=document.getElementById('returnLobbyBtn');
  bindAsync(returnLobbyBtn, returnToLobbyAction);
}

render();
</script>
